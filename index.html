<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020608">
<title>IRON WARS v10</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="portraitWarning">
  <div>
    <div class="rotateIcon">📱↻</div>
    <h1>IRON WARS</h1>
    <p>Telefonu yatay çevir.</p>
  </div>
</div>

<div id="game">
  <div id="ambientFill"></div>
  <div id="designStage">
  <img id="baseImage" src="assets/iron-wars-base-v14.jpg" alt="IRON WARS">

  <div id="fxStage" aria-hidden="true">
    <div class="smoke-emitter smoke-steel"></div>
    <div class="smoke-emitter smoke-research"></div>
    <div class="smoke-emitter smoke-command"></div>

    <i class="warning-light l1"></i>
    <i class="warning-light l2"></i>
    <i class="warning-light l3"></i>
    <i class="warning-light l4"></i>

    <div class="runway-lights">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <div class="water-shimmer s1"></div>
    <div class="water-shimmer s2"></div>
    <div class="water-shimmer s3"></div>

    <div class="vehicle vehicle1"></div>
    <div class="vehicle vehicle2"></div>
    <div class="heli-shadow"></div>
  </div>

  
<div id="v17TopResources">
  <div class="v17res money"><small>Para</small><b id="v17Money">0</b></div>
  <div class="v17res oil"><small>Fuel</small><b id="v17Oil">50.000</b></div>
  <div class="v17res steel"><small>Çelik</small><b id="v17Steel">100.000</b></div>
  <div class="v17res copper"><small>Bakır</small><b id="v17Copper">100.000</b></div>
  <div class="v17res gold"><small>Altın</small><b id="v17Gold">25.000</b></div>
</div>

<div id="v17Queue" class="hidden">
  <div class="qtitle">ÜRETİM</div>
  <div class="qname" id="v17QueueName">Çelik Fabrikası</div>
  <div class="qbar"><i id="v17QueueBar"></i></div>
  <div class="qtime" id="v17QueueTime">01:00</div>
  <div class="qgain" id="v17QueueGain">+0</div>
</div>

<!-- real fullscreen hit area over the visual icon -->
  <button id="fullscreenButton" aria-label="Tam ekran" onclick="toggleFullscreen(event)">⛶</button>

  <div id="toast"></div>
  </div>
</div>

<div id="buildingPanel" class="hidden">
  <div class="panelCard">
    <button class="closeBtn" onclick="closePanel()">✕</button>
    <h2 id="panelTitle"></h2>
    <p id="panelText"></p>
    <div class="panelStats">
      <div><b id="statLevel"></b><span>SEVİYE</span></div>
      <div><b id="statPower"></b><span>GÜÇ</span></div>
      <div><b id="statState"></b><span>DURUM</span></div>
    </div>
    <button class="upgradeBtn" onclick="upgradeSelected()">SEVİYE YÜKSELT</button>
  </div>
</div>

<div id="zones"></div>

<script src="game.js"></script>

<div id="v15Panel" class="v15-panel hidden">
  <div class="v15-card">
    <button id="v15Close">×</button>
    <div id="v15Icon">🏭</div>
    <h2 id="v15Title">Bina</h2>
    <div id="v15Level">Seviye 1</div>
    <div class="v15-stats">
      <div><span>Üretim</span><b id="v15Production">+0/s</b></div>
      <div><span>Dayanıklılık</span><b id="v15Hp">100%</b></div>
    </div>
    <div class="v15-progress"><i id="v15Bar"></i></div>
    <div id="v15Timer">Hazır</div>
    <button id="v15Upgrade">GELİŞTİR</button>
  </div>
</div>
<div id="v15Hud">
  <div>💵 <b id="v15Money">2.45M</b></div>
  <div>🛢️ <b id="v15Oil">1.87M</b></div>
  <div>🔩 <b id="v15Steel">3.24M</b></div>
</div>
<script src="v17.js"></script>
</body>
</html>
