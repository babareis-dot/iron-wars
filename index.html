<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071015">
<title>IRON WARS v0.3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rotateOverlay">
  <div class="rotateBox">
    <div class="rotateIcon">📱↻</div>
    <h1>IRON WARS</h1>
    <p>Telefonu yatay çevir.</p>
    <button onclick="enterFullscreen()">TAM EKRAN</button>
  </div>
</div>

<div id="viewport">
  <div id="gameFrame">
    <div class="scene">
      <div class="base-art"></div>
      <div class="shade"></div>

      <header class="hud top">
        <div class="brand">
          <span class="mark">✠</span>
          <div><b>IRON WARS</b><small>GLOBAL CONFLICT</small></div>
        </div>
        <div class="resources" id="resources"></div>
        <div class="topBtns">
          <button onclick="enterFullscreen()">⛶</button>
          <button>✉</button>
          <button>⚙</button>
        </div>
      </header>

      <section class="commander glass">
        <div class="avatar">★</div>
        <div class="cinfo">
          <b>Commander</b>
          <span>Lv.45</span>
          <div class="xp"><i></i></div>
          <small>26,750 / 57,000</small>
        </div>
        <div class="vip">VIP 6</div>
      </section>

      <aside class="build glass" id="buildPanel">
        <div class="buildTitle">İNŞAAT <span>3/3</span></div>
        <div id="buildQueue"></div>
        <button class="row">🧬 ARAŞTIRMA <small>2/2</small></button>
        <button class="row">🎖 EĞİTİM <small>2/3</small></button>
        <button class="row">🔧 ONARIM <small>1/1</small></button>
      </aside>

      <div id="hotspots"></div>

      <aside class="rightMenu">
        <button onclick="showToast('Etkinlikler')">🎁<b>2</b><span>ETKİNLİK</span></button>
        <button onclick="showToast('Paketler')">📦<b>1</b><span>PAKETLER</span></button>
        <button onclick="showToast('Sıralama')">🏆<span>SIRALAMA</span></button>
        <button onclick="showToast('İttifak')">🛡<span>İTTİFAK</span></button>
        <button onclick="showToast('Posta')">✉<b>6</b><span>POSTA</span></button>
      </aside>

      <div class="event glass">
        <b>ÖZEL ETKİNLİK</b>
        <span>🔥 Çelik Fırtına</span>
        <small>2g 08:17:29</small>
      </div>

      <div class="worldBtns">
        <button onclick="showToast('Dünya haritası')">🌍<span>DÜNYA</span></button>
        <button onclick="toggleBuild()">🏗<span>İNŞAAT</span></button>
      </div>

      <div class="chat glass">
        <div><b>GENEL</b><span>İTTİFAK</span><span>ÖZEL</span></div>
        <p><i>[TR]Commander:</i> Akşam 21:00 saldırı.</p>
      </div>

      <footer class="dock hud">
        <button onclick="showToast('Üsler')">🏛<span>ÜSLER</span></button>
        <button onclick="showToast('Binalar')">🏢<span>BİNALAR</span></button>
        <button onclick="openProduction()">🪖<span>ÜRETİM</span></button>
        <button onclick="showToast('Birlikler')">⚔<span>BİRLİKLER</span></button>
        <button onclick="showToast('İttifak')">🛡<span>İTTİFAK</span></button>
        <button onclick="showToast('Envanter')">📦<span>ENVANTER</span></button>
        <button class="shop" onclick="showToast('Mağaza')">🛒<span>MAĞAZA</span></button>
      </footer>
    </div>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modalCard glass">
    <button class="close" onclick="closeModal()">✕</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast"></div>

<script src="game.js"></script>
</body>
</html>
