<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#081014">
  <title>IRON WARS v0.2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rotate">
  <div class="rotate-card">
    <div class="phone">📱</div>
    <h1>IRON WARS</h1>
    <p>Oyunu tam ekran oynamak için telefonu yatay çevir.</p>
    <button onclick="toggleFullscreen()">TAM EKRAN</button>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">✠</span><div><b>IRON WARS</b><small>GLOBAL CONFLICT</small></div></div>
    <div id="resources" class="resources"></div>
    <div class="header-actions">
      <button onclick="toggleFullscreen()">⛶</button>
      <button>✉</button>
      <button>⚙</button>
    </div>
  </header>

  <main class="battlefield">
    <div class="art"></div>
    <div class="vignette"></div>

    <section class="commander glass">
      <div class="portrait">★</div>
      <div class="commander-info">
        <b>Commander</b>
        <span>Lv.45</span>
        <div class="xp"><i></i></div>
      </div>
      <div class="vip">VIP 6</div>
    </section>

    <aside class="build-panel glass" id="buildPanel">
      <div class="panel-title">İNŞAAT <span>3/3</span></div>
      <div id="buildQueue"></div>
      <button class="compact-row">🧬 ARAŞTIRMA <small>2/2</small></button>
      <button class="compact-row">🎖 EĞİTİM <small>2/3</small></button>
      <button class="compact-row">🔧 ONARIM <small>1/1</small></button>
    </aside>

    <div id="hotspots"></div>

    <div class="left-quick">
      <button onclick="showToast('Dünya haritası açıldı')">🌍<span>DÜNYA</span></button>
      <button onclick="toggleBuild()">🏗️<span>İNŞAAT</span></button>
    </div>

    <aside class="rightbar">
      <button onclick="showToast('Etkinlikler')">🎁<b>2</b><span>ETKİNLİK</span></button>
      <button onclick="showToast('Paketler')">📦<b>1</b><span>PAKET</span></button>
      <button onclick="showToast('Sıralama')">🏆<span>SIRALAMA</span></button>
      <button onclick="showToast('İttifak')">🛡️<span>İTTİFAK</span></button>
      <button onclick="showToast('Posta')">✉️<b>6</b><span>POSTA</span></button>
    </aside>

    <div class="event-card glass">
      <strong>ÖZEL ETKİNLİK</strong>
      <span>🔥 Çelik Fırtına</span>
      <small>2g 08:17:29</small>
    </div>

    <div class="chat-mini glass">
      <div><b>GENEL</b><span>İTTİFAK</span></div>
      <p><i>[TR]Commander:</i> Akşam 21:00 saldırı.</p>
    </div>
  </main>

  <footer class="dock">
    <button onclick="showToast('Üsler')">🏛️<span>ÜSLER</span></button>
    <button onclick="showToast('Binalar')">🏢<span>BİNALAR</span></button>
    <button onclick="openProduction()">🪖<span>ÜRETİM</span></button>
    <button onclick="showToast('Birlikler')">⚔️<span>BİRLİKLER</span></button>
    <button onclick="showToast('İttifak')">🛡️<span>İTTİFAK</span></button>
    <button onclick="showToast('Envanter')">📦<span>ENVANTER</span></button>
    <button class="gold" onclick="showToast('Mağaza')">🛒<span>MAĞAZA</span></button>
  </footer>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card glass">
    <button class="close" onclick="closeModal()">✕</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast"></div>
<script src="game.js"></script>
</body>
</html>
